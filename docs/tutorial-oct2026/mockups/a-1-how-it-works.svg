<rect x="158" y="77" width="18" height="6" rx="3" fill="#f5a623"/><circle cx="181" cy="80" r="3" fill="#3a4252"/><circle cx="195" cy="80" r="3" fill="#3a4252"/><circle cx="209" cy="80" r="3" fill="#3a4252"/><circle cx="223" cy="80" r="3" fill="#3a4252"/>
<text x="370" y="85" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#8494a7" text-anchor="end">Skip</text>
<rect x="20" y="112" width="350" height="250" rx="24" fill="#0b1222" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
<path d="M60 320 C 120 250, 150 300, 200 230 S 290 170, 330 150" fill="none" stroke="#2a3346" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M60 320 C 120 250, 150 300, 200 230 S 290 170, 330 150" fill="none" stroke="#f5a623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="60" cy="320" r="7" fill="#f5a623"/>
<circle cx="330" cy="150" r="8" fill="#030712" stroke="#f0f2f5" stroke-width="2.5"/>
<rect x="44" y="132" width="132" height="30" rx="15" fill="rgba(245,166,35,0.12)" stroke="rgba(245,166,35,0.35)" stroke-width="1"/>
<text x="110" y="152" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5a623" text-anchor="middle">Starts at 15 mph</text>
<rect x="232" y="300" width="132" height="30" rx="15" fill="#0a1120" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
<text x="298" y="320" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f2f5" text-anchor="middle">Stops when parked</text>
<text x="24" y="412" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f0f2f5" text-anchor="start">MileClear records your</text>
<text x="24" y="446" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f0f2f5" text-anchor="start">drives by itself</text>
<text x="24" y="484" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="start">You don't need to open the app or press</text>
<text x="24" y="508" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="start">anything. Drive as normal and each trip</text>
<text x="24" y="532" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="start">appears on Home when you stop.</text>
<circle cx="36" cy="578" r="10" fill="#10b981"/><path d="M31 578 L34.5 581.5 L41 574" fill="none" stroke="#04140d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="576" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f2f5" text-anchor="start">Leave your phone in your pocket or cradle</text>
<text x="58" y="596" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">It works with the app closed.</text>
<circle cx="36" cy="634" r="10" fill="#10b981"/><path d="M31 634 L34.5 637.5 L41 630" fill="none" stroke="#04140d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="632" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f2f5" text-anchor="start">A stop of 4 minutes or more ends a trip</text>
<text x="58" y="652" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">A shop stop gives you two trips. Nothing is lost.</text>
<circle cx="36" cy="690" r="10" fill="#10b981"/><path d="M31 690 L34.5 693.5 L41 686" fill="none" stroke="#04140d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="688" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f2f5" text-anchor="start">You sort each trip</text>
<text x="58" y="708" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">Business or Personal, one tap.</text>
<rect x="20" y="752" width="350" height="56" rx="14" fill="#f5a623"/><text x="195" y="785.6" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1204" text-anchor="middle">Next</text>
</svg>