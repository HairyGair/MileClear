<path d="M30 72 L22 80 L30 88" fill="none" stroke="#f0f2f5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="167" cy="80" r="3" fill="#3a4252"/><circle cx="181" cy="80" r="3" fill="#3a4252"/><rect x="186" y="77" width="18" height="6" rx="3" fill="#f5a623"/><circle cx="209" cy="80" r="3" fill="#3a4252"/><circle cx="223" cy="80" r="3" fill="#3a4252"/>
<text x="370" y="85" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#8494a7" text-anchor="end">Skip</text>
<circle cx="195" cy="168" r="52" fill="rgba(245,166,35,0.12)"/>
<path d="M177 170 L215 150 L199 190 L196 173 Z" fill="none" stroke="#f5a623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="195" y="262" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#f0f2f5" text-anchor="middle">One setting makes it work</text>
<text x="195" y="296" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle">To record drives while the app is closed,</text>
<text x="195" y="318" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle">MileClear needs your location set to Always.</text>
<rect x="28" y="352" width="334" height="196" rx="18" fill="#151d2e" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<text x="195" y="384" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8494a7" text-anchor="middle">Your iPhone will ask twice</text>
<text x="48" y="422" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f5a623" text-anchor="start">1</text>
<text x="70" y="422" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#f0f2f5" text-anchor="start">First, tap</text>
<rect x="146" y="404" width="160" height="26" rx="8" fill="#24314a"/>
<text x="226" y="422" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7ab8ff" text-anchor="middle">Allow While Using</text>
<line x1="48" y1="446" x2="342" y2="446" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="48" y="478" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f5a623" text-anchor="start">2</text>
<text x="70" y="478" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#f0f2f5" text-anchor="start">Later, tap</text>
<rect x="146" y="460" width="172" height="26" rx="8" fill="#24314a"/>
<text x="232" y="478" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7ab8ff" text-anchor="middle">Change to Always Allow</text>
<text x="70" y="508" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">This one is what lets trips record</text>
<text x="70" y="527" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">with the app closed.</text>
<text x="28" y="594" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#94a3b8">We only use your location to measure drives. </tspan></text>
<text x="28" y="614" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#94a3b8">We never sell it. </tspan><tspan font-weight="600" fill="#f5a623">Read how we use it</tspan></text>
<rect x="20" y="680" width="350" height="56" rx="14" fill="#f5a623"/><text x="195" y="713.6" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1204" text-anchor="middle">Allow location</text>
<text x="195" y="778" font-family="Plus Jakarta Sans, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#8494a7" text-anchor="middle">I'd rather add trips myself</text>
</svg>