<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Live trip route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#131d31;}
  #map{position:absolute;inset:0;background:#131d31;}
  .leaflet-tile-pane{filter:saturate(.72) brightness(.82) contrast(1.02);}
  .leaflet-control-attribution{font:400 9px system-ui,sans-serif;background:rgba(8,13,25,.7);color:#96a2b6;}
  .leaflet-control-attribution a{color:#f5a623;}
  .mc-start{width:12px;height:12px;border-radius:50%;background:#f8fafc;border:2.5px solid #080d19;box-shadow:0 0 0 1.5px rgba(255,255,255,.25);}
  .mc-now{position:relative;width:16px;height:16px;}
  .mc-now b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#f5a623;border:2.5px solid #080d19;z-index:2;}
  .mc-now i{position:absolute;top:50%;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#f5a623;opacity:.5;animation:ping 1.6s ease-out infinite;}
  @keyframes ping{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(3.2);opacity:0}}
  @media (prefers-reduced-motion: reduce){.mc-now i{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<script>
  // Partial, in-progress route — recording is still live
  const route = [
    [51.3762, -0.0982],[51.3785, -0.1002],[51.3818, -0.1009],
    [51.3852, -0.1006],[51.3889, -0.1014],[51.3912, -0.1011]
  ];
  const start = route[0];
  const now = route[route.length - 1];

  const map = L.map('map', {
    zoomControl: false, attributionControl: true,
    dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, touchZoom: false, tap: false
  });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(map);

  L.polyline(route, { color: '#f5a623', weight: 4, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(map);
  L.marker(start, { icon: L.divIcon({ className: '', html: '<div class="mc-start"></div>', iconSize: [12,12], iconAnchor: [6,6] }) }).addTo(map);
  L.marker(now,   { icon: L.divIcon({ className: '', html: '<div class="mc-now"><i></i><b></b></div>', iconSize: [16,16], iconAnchor: [8,8] }) }).addTo(map);

  map.fitBounds(L.latLngBounds(route), { padding: [40, 34] });
</script>
</body>
</html>
